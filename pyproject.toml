[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-analysis"
version = "0.1.0"
description = "YOLO26-based badminton video analytics MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "ultralytics>=8.4.0",
]

[project.scripts]
badminton-analyze = "badminton_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
